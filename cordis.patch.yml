# ============================================================================
# dsh-cook-pet 的 bundle patch —— 把小厨娘「照照」挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   DSH 启动时按 bundle 层栈把各插件的 patch 叠成配置树，本文件就是本插件这一层。
#
# 【必须遵守的两条硬契约】
#   1. id 必须与包名一致（dsh-cook-pet），且全局唯一：
#      DSH STORE 上架契约按 id 比对 entryIds，裸名（如 cook-pet）会与其它插件的行冲突。
#   2. `id: 值` 那一行**绝不能写行尾注释**：商城预检用正则抓该行的值并要求其后直接换行，
#      行尾注释会让它抓不到 entry ID，整份提交被判 SUBMISSION_ENTRY_MISSING。
#
# 【为什么 name 是 dsh-cook-pet】
#   解析到本包入口 lib/index.js（宿主侧 Cordis 插件）。
#   本插件**没有浏览器半侧**：不声明 dsh.client、不导出 ./client，
#   桌宠只以 lib/desktop.js 拉起的 Electron 置顶窗形式存在。
# ============================================================================

- insert:
    - id: dsh-cook-pet
      name: dsh-cook-pet
